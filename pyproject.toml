[project]
name = "clicky-recurring-runs"
version = "0.1.0"
description = "A typed REST API demo for explicit recurring agent runs with idempotent enqueueing."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.26,<1",
  "pytest>=7,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
